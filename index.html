    <!-- Dynamic asset failure listeners -->
    <script>
      // Catch style resource loading failures and reload them
      window.addEventListener('error', function(e) {
        var target = e.target;
        if (target && target.tagName === 'LINK' && target.rel === 'stylesheet') {
          console.error('Stylesheet load failed:', target.href);
          if (!target.href.includes('cc_retry=')) {
            var separator = target.href.includes('?') ? '&' : '?';
            target.href = target.href + separator + 'cc_retry=' + Date.now();
          }
        }
      }, true); // Capture phase required as resource events do not bubble

      // Intercept dynamic chunk loading issues and force page reload to capture latest build
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e.reason || {};
        var msg = reason.message || '';
        var name = reason.name || '';
        if (
          msg.includes('Failed to fetch dynamically imported module') ||
          msg.includes('ChunkLoadError') ||
          msg.includes('Loading chunk') ||
          name === 'ChunkLoadError'
        ) {
          console.warn('Unhandled dynamic chunk rejection. Reloading page...', e.reason);
          e.preventDefault();
          
          var reloadKey = 'cc_chunk_reload_count';
          var count = parseInt(sessionStorage.getItem(reloadKey) || '0', 10);
          if (count < 2) {
            sessionStorage.setItem(reloadKey, String(count + 1));
            window.location.reload(true);
          } else {
            console.error('Max auto-reloads hit. Rendering fallback UI.');
            sessionStorage.removeItem(reloadKey);
          }
        }
      });
    </script>

    <!-- CSS Loading Verification Verification Script -->
    <script>
      setTimeout(function() {
        var test = document.createElement('div');
        test.className = 'hidden';
        test.style.position = 'absolute';
        test.style.left = '-9999px';
        document.body.appendChild(test);
        
        var style = window.getComputedStyle(test);
        var cssLoaded = style.display === 'none';
        document.body.removeChild(test);
        
        if (!cssLoaded) {
          console.error('Tailwind stylesheet loading failed or inactive.');
          var banner = document.getElementById('css-failure-banner');
          if (banner) {
            banner.style.display = 'flex';
          }
        } else {
          console.log('CSS stylesheet validated successfully.');
        }
      }, 2500);
    </script>
