      // Catch style resource loading failures and reload them

        var target = e.target;
        if (target && target.tagName === 'LINK' && target.rel === 'stylesheet') {
          console.error('Stylesheet load failed:', target.href);
          if (!target.href.includes('cc_retry=')) {
            var separator = target.href.includes('?') ? '&' : '?';
            target.href = target.href + separator + 'cc_retry=' + Date.now();
          }
        }
      }, true); // Capture phase required as resource events do not bubble

      // Intercept dynamic chunk loading issues and force page reload to capture latest build
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e.reason || {};
        var msg = reason.message || '';
        var name = reason.name || '';
        if (
          msg.includes('Failed to fetch dynamically imported module') ||
          msg.includes('ChunkLoadError') ||
          msg.includes('Loading chunk') ||
          name === 'ChunkLoadError'
        ) {
          console.warn('Unhandled dynamic chunk rejection. Reloading page...', e.reason);
          e.preventDefault();
          
          var reloadKey = 'cc_chunk_reload_count';
          var count = parseInt(sessionStorage.getItem(reloadKey) || '0', 10);
          if (count < 2) {
            sessionStorage.setItem(reloadKey, String(count + 1));
            window.location.reload(true);
          } else {
            console.error('Max auto-reloads hit. Rendering fallback UI.');
            sessionStorage.removeItem(reloadKey);
          }
        }
      });

    <!-- Splash dismiss: fast on good networks, patient on slow ones -->
    <script>
      (function () {
        var splash = document.getElementById('app-splash');
        if (!splash) return;
        var shownAt = Date.now();
        var MIN_MS = 3500;  // increased — shows full 39-frame GIF before dismiss
        var MAX_MS = 12000; // patient on slow networks so GIF finishes loading
        var dismissed = false;

        function dismiss() {
          if (dismissed) return;
          dismissed = true;
          splash.classList.add('hide');
          setTimeout(function () {
            if (splash.parentNode) splash.parentNode.removeChild(splash);
          }, 500);
        }

        function dismissSoon() {
          var elapsed = Date.now() - shownAt;
          var wait = Math.max(0, MIN_MS - elapsed);
          setTimeout(dismiss, wait);
        }

        // Fast path: everything (JS bundle, fonts, first paint) loaded
        if (document.readyState === 'complete') {
          dismissSoon();
        } else {
          window.addEventListener('load', dismissSoon);
        }
        // Earliest path: React itself signals it has mounted
        window.addEventListener('app-ready', dismissSoon);
        // Safety net for slow/hanging networks
        setTimeout(dismiss, MAX_MS);
      })();
    </script>
